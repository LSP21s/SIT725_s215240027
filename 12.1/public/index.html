<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Management - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Recipe Manager</div>
    <nav>
        <a href="#">Login</a>
        <a href="#">Create Profile</a>
    </nav>
</header>


<main>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Welcome back, User</h1>
        <p>Find your next recipe</p>

        <form class="hero-search" onsubmit="event.preventDefault(); loadSearch();">
            <input id="search" type="text" placeholder="Search recipes...">
            <button type="submit">Search</button>
        </form>
    </section>



    <!-- FEATURED recipes -->
    <section class="section">
        <h2>Featured Recipes</h2>

        <div id="featured-section" class="card-grid">
            <!-- Cards will load here from scripts.js -->
        </div>
    </section>



    <!-- LATEST RECIPES -->
    <section class="section">
        <h2>Latest Recipes</h2>

        <div id="latest-section" class="card-grid">
            <!-- JS will fill this with loadLatest() -->
        </div>
    </section>


</main>


<script src="scripts.js"></script>

</body>
</html>
