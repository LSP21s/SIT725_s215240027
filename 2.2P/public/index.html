<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator that can add for you</title>
</head>
<body>
  <h1>Enter two numbers you want to add below</h1>

  <label>Number 1:</label>
  <input type="text" id="num1"><br><br>

  <label>Number 2:</label>
  <input type="text" id="num2"><br><br>

  <button type="button" onclick="addNumbers()">Press here to calculate Sum</button>

  <p id="result"></p>

  <script> // Start the script with async function 
  async function addNumbers() {
    const num1 = document.getElementById('num1').value.trim();
    const num2 = document.getElementById('num2').value.trim();

    const response = await fetch(`/add?num1=${num1}&num2=${num2}`);
    const data = await response.text();
    document.getElementById('result').innerText = data;
  }
</script>


</body>
</html>
